        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Grant execute permission for qt-cmake'
      shell: bash
      run: |
        find "${{ runner.temp }}/Qt/${{ env.QT_VERSION }}" -type f \( -name qt-cmake -o -name androiddeployqt \) -exec chmod +x {} \;

    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: 'Get version from CMakeLists.txt'
      id: get_version
      run: |
        VERSION=$(grep 'set(AMNEZIAVPN_VERSION' CMakeLists.txt | sed -E 's/.*AMNEZIAVPN_VERSION ([0-9]+.[0-9]+.[0-9]+.[0-9]+)\)/\1/')
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Version: $VERSION"

    # - name: 'Setup ccache'
    #   uses: hendrikmuhs/ccache-action@v1.2

    - name: 'Setup Java'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        # cache: 'gradle'

    - name: 'Setup Android NDK'
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: 'r26b'

    - name: 'Prepare Android keystore (optional)'
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_KEY_ALIAS }}
        KEY_PASS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_KEY_PASS }}
      shell: bash
      run: |
        set -euo pipefail

        KEYSTORE_PATH="${GITHUB_WORKSPACE}/android.keystore"
        rm -f "$KEYSTORE_PATH"

        if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASS:-}" ]; then
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: android.keystore was not decoded correctly"
            exit 1
          fi
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEYSTORE_KEY_PASS=$KEY_PASS"
            echo "ANDROID_SIGNING_SOURCE=release-keystore"
          } >> "$GITHUB_ENV"
          echo "Using release Android keystore from secrets."
        else
          echo "::warning::ANDROID_RELEASE_KEYSTORE_* secrets are not fully configured. Generating temporary debug keystore."
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "android" \
            -alias "androiddebugkey" \
            -keypass "android" \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_KEY_ALIAS=androiddebugkey"
            echo "ANDROID_KEYSTORE_KEY_PASS=android"
            echo "ANDROID_SIGNING_SOURCE=generated-debug-keystore"
          } >> "$GITHUB_ENV"
        fi

    - name: 'Build Android APK (arm64-v8a + armeabi-v7a) + AAB'
      env:
        ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        QT_HOST_PATH: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
        ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
        ANDROID_KEYSTORE_KEY_ALIAS: ${{ env.ANDROID_KEYSTORE_KEY_ALIAS }}
        ANDROID_KEYSTORE_KEY_PASS: ${{ env.ANDROID_KEYSTORE_KEY_PASS }}
      shell: bash
      run: ./deploy/build_android.sh --aab --apk 'armeabi-v7a;arm64-v8a' --build-platform ${{ env.ANDROID_BUILD_PLATFORM }}

    - name: 'Rename Android APK'
      run: |
        cd deploy/build
        mv FBLink-release.apk FBLinkVPN_${VERSION}_android9+_universal.apk
        cd ../..

    - name: 'Verify signed Android APK'
      shell: bash
      run: |
        APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)
        if [ -z "${APKSIGNER:-}" ] || [ ! -x "$APKSIGNER" ]; then
          echo "ERROR: apksigner not found under ${ANDROID_HOME}/build-tools"
          exit 1
        fi

        "$APKSIGNER" verify --verbose "deploy/build/FBLinkVPN_${VERSION}_android9+_universal.apk"

    - name: 'Upload universal apk'
      uses: actions/upload-artifact@v4
      with:
        name: FBLinkVPN_${{ env.VERSION }}_android9+_universal.apk
        path: deploy/build/FBLinkVPN_${{ env.VERSION }}_android9+_universal.apk
        compression-level: 0
        retention-days: 7

    - name: 'Upload aab'
      uses: actions/upload-artifact@v4
      with:
        name: FBLinkVPN-android
        path: deploy/build/FBLink-release.aab
        compression-level: 0
        retention-days: 7

    - name: 'Install android_x86_64 Qt'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'android'
        arch: 'android_x86_64'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Build Android TV APK (x86_64 + arm64-v8a)'
      env:
        ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        QT_HOST_PATH: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
        ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
        ANDROID_KEYSTORE_KEY_ALIAS: ${{ env.ANDROID_KEYSTORE_KEY_ALIAS }}
        ANDROID_KEYSTORE_KEY_PASS: ${{ env.ANDROID_KEYSTORE_KEY_PASS }}
      shell: bash
      run: ./deploy/build_android.sh --tv --apk 'x86_64;arm64-v8a' --build-platform ${{ env.ANDROID_BUILD_PLATFORM }}

    - name: 'Rename Android TV APK'
      run: |
        cd deploy/build
        mv FBLinkTV-release.apk FBLinkTV_${VERSION}_androidtv_universal.apk
        cd ../..

    - name: 'Verify signed Android TV APK'
      shell: bash
      run: |
        APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)
        "$APKSIGNER" verify --verbose "deploy/build/FBLinkTV_${VERSION}_androidtv_universal.apk"

    - name: 'Upload Android TV APK'
      uses: actions/upload-artifact@v4
      with:
        name: FBLinkTV_${{ env.VERSION }}_androidtv_universal.apk
        path: deploy/build/FBLinkTV_${{ env.VERSION }}_androidtv_universal.apk
        compression-level: 0
        retention-days: 7

  Extra:
    runs-on: ubuntu-latest
    steps:
      - name: Search a corresponding PR
        uses: octokit/request-action@v2.x
        id: pull_request
        with:
          route: GET /repos/${{ github.repository }}/pulls
          head: ${{ github.repository_owner }}:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add PR link to build summary
        if: ${{ fromJSON(steps.pull_request.outputs.data)[0].number != '' }}
        run: | 
          echo "Pull request:" >> $GITHUB_STEP_SUMMARY
          echo "[[#${{ fromJSON(steps.pull_request.outputs.data)[0].number }}] ${{ fromJSON(steps.pull_request.outputs.data)[0].title }}](${{ fromJSON(steps.pull_request.outputs.data)[0].html_url }})" >> $GITHUB_STEP_SUMMARY
