name: 'Deploy workflow'

on:
  push:
    branches:
      - '**'

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/ # https://download.qt.io/static/mirrorlist/

jobs:
  Detect-Changes:
    runs-on: ubuntu-latest
    outputs:
      recipes_changed: ${{ steps.filter.outputs.recipes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            recipes:
              - 'recipes/**'
              - 'conanfile.py'
              - '.github/workflows/deploy.yml'
              - 'cmake/conan_provider.cmake'
              - 'cmake/platform_settings.cmake'
              - 'cmake/recipes_bootstrap.cmake'

  # Bake Conan prebuilts on the same glibc/distros we ship for, never on
  # ubuntu-latest (24.04+): otherwise openssl/etc. require GLIBC_2.38 and break 20.04/22.04.
  Bake-Prebuilts-Linux:
    runs-on: ubuntu-latest
    needs: Detect-Changes
    if: needs.Detect-Changes.outputs.recipes_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['20.04', '22.04']
    container:
      image: ubuntu:${{ matrix.ubuntu }}
      options: --user root

    steps:
    - name: 'Install git'
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates git

    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Container setup'
      run: bash deploy/ci/linux_container_setup.sh

    - name: 'Install conan'
      run: pip3 install "conan==2.28.0"

    - name: 'Build dependencies'
      shell: bash
      env:
        # Always compile in-container; do not reuse foreign glibc binaries.
        CONAN_INSTALL_ARGS: "--build=*;-o=openssl/*:shared=True"
      run: |
        conan profile detect --force
        for build_type in Release Debug; do
          cmake -S . -B "build-${{ matrix.ubuntu }}" -DPREBUILTS_ONLY=1 "-DCMAKE_BUILD_TYPE=$build_type"
        done

    - name: 'Authorize in remote'
      if: github.ref == 'refs/heads/dev'
      run: conan remote login amnezia "${{ secrets.CONAN_USER }}" -p "${{ secrets.CONAN_PASSWORD }}"

    - name: 'Upload baked prebuilts'
      if: github.ref == 'refs/heads/dev'
      run: conan upload -r amnezia "*" -c

# ------------------------------------------------------

  # Two Linux installers:
  # - ubuntu20.04: built in ubuntu:20.04 (glibc 2.31) — runs on 20.04 and newer
  # - ubuntu22.04: built in ubuntu:22.04 (glibc 2.35) — runs on 22.04 and newer
  Build-Linux-Ubuntu:
    runs-on: ubuntu-latest
    needs: Bake-Prebuilts-Linux
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: '20.04'
            artifact_tag: ubuntu20.04
            qt_from_source: true
          - ubuntu: '22.04'
            artifact_tag: ubuntu22.04
            qt_from_source: false
    container:
      image: ubuntu:${{ matrix.ubuntu }}
      options: --user root

    env:
      QT_VERSION: 6.10.1
      QIF_VERSION: 4.7
      QT_INSTALL_DIR: /opt
      PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}
      PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
      FALLBACK_S3_ENDPOINT: ${{ secrets.FALLBACK_S3_ENDPOINT }}
      DEV_AGW_PUBLIC_KEY: ${{ secrets.DEV_AGW_PUBLIC_KEY }}
      DEV_AGW_ENDPOINT: ${{ secrets.DEV_AGW_ENDPOINT }}
      DEV_S3_ENDPOINT: ${{ secrets.DEV_S3_ENDPOINT }}
      FREE_V2_ENDPOINT: ${{ secrets.FREE_V2_ENDPOINT }}
      PREM_V1_ENDPOINT: ${{ secrets.PREM_V1_ENDPOINT }}

    steps:
    - name: 'Install git'
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates git

    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Container setup'
      run: bash deploy/ci/linux_container_setup.sh

    - name: 'Install conan'
      run: pip3 install "conan==2.28.0"

    - name: 'Configure Conan for this distro'
      run: |
        conan profile detect --force
        # Do not reuse amnezia remote binaries: same package_id can be linked
        # against a newer glibc (built on 24.04) and break this container's target.
        conan remote disable amnezia || true

    - name: 'Cache Qt (source build, 20.04)'
      if: matrix.qt_from_source
      uses: actions/cache@v4
      with:
        path: /opt/Qt/${{ env.QT_VERSION }}
        key: qt-src-${{ env.QT_VERSION }}-ubuntu${{ matrix.ubuntu }}-gcc10

    - name: 'Build Qt from source (20.04)'
      if: matrix.qt_from_source
      run: bash deploy/ci/build_qt_from_source.sh
      env:
        QT_VERSION: ${{ env.QT_VERSION }}
        QT_PREFIX: /opt/Qt/${{ env.QT_VERSION }}/gcc_64

    - name: 'Install Qt IFW (20.04)'
      if: matrix.qt_from_source
      run: bash deploy/ci/install_qt_ifw.sh
      env:
        QIF_VERSION: ${{ env.QIF_VERSION }}

    - name: 'Install Qt (official binaries, 22.04+)'
      if: ${{ !matrix.qt_from_source }}
      run: |
        set -euo pipefail
        pip3 install "aqtinstall==3.3.0" "py7zr==0.22.*"
        python3 -m aqt install-qt linux desktop "${{ env.QT_VERSION }}" linux_gcc_64 \
          -m qtremoteobjects qt5compat qtshadertools \
          -O /opt/Qt \
          --base "${{ env.QT_MIRROR }}"
        python3 -m aqt install-tool linux desktop tools_ifw \
          -O /opt/Qt \
          --base "${{ env.QT_MIRROR }}"
        if [[ ! -x /opt/Qt/Tools/QtInstallerFramework/${{ env.QIF_VERSION }}/bin/binarycreator ]]; then
          found="$(find /opt/Qt -type f -name binarycreator 2>/dev/null | head -1 || true)"
          if [[ -n "${found}" ]]; then
            mkdir -p "/opt/Qt/Tools/QtInstallerFramework/${{ env.QIF_VERSION }}/bin"
            cp -a "$(dirname "${found}")/." "/opt/Qt/Tools/QtInstallerFramework/${{ env.QIF_VERSION }}/bin/"
          fi
        fi

    - name: 'Build project'
      shell: bash
      env:
        # Force compiling all Conan packages inside this glibc.
        CONAN_INSTALL_ARGS: "--build=*;-o=openssl/*:shared=True"
      run: deploy/build.sh --generator Ninja --installer all -f

    - name: 'Verify glibc ceiling'
      shell: bash
      run: |
        set -euo pipefail
        bin="$(find deploy/build -type f -name AmneziaVPN -perm -111 ! -name '*.sh' | head -1)"
        echo "Checking ${bin}"
        mapfile -t vers < <(strings "${bin}" | grep -E '^GLIBC_2\.[0-9]+$' | sort -Vu)
        if [[ ${#vers[@]} -eq 0 ]]; then
          echo "ERROR: no GLIBC version symbols found in ${bin}"
          exit 1
        fi
        printf 'GLIBC symbols: %s\n' "${vers[*]}"
        max="${vers[-1]}"
        echo "Max GLIBC symbol: ${max}"
        max_minor="${max#GLIBC_2.}"
        if [[ "${{ matrix.ubuntu }}" == "20.04" && "${max_minor}" -gt 31 ]]; then
          echo "ERROR: binary requires ${max}, Ubuntu 20.04 only has glibc 2.31"
          exit 1
        fi
        if [[ "${{ matrix.ubuntu }}" == "22.04" && "${max_minor}" -gt 35 ]]; then
          echo "ERROR: binary requires ${max}, Ubuntu 22.04 only has glibc 2.35"
          exit 1
        fi

    - name: 'Tag installer artifact'
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=(deploy/build/AmneziaVPN_*_linux_x64.run)
        if [[ ${#files[@]} -eq 0 ]]; then
          echo "No .run installer found"; ls -la deploy/build || true; exit 1
        fi
        for f in "${files[@]}"; do
          mv -v "$f" "${f/_linux_x64.run/_linux_x64_${{ matrix.artifact_tag }}.run}"
        done
        ls -la deploy/build/AmneziaVPN_*_linux_x64_*.run

    - name: 'Upload installer artifact'
      uses: actions/upload-artifact@v7
      with:
        name: AmneziaVPN_linux_${{ matrix.artifact_tag }}
        path: deploy/build/AmneziaVPN_*_linux_x64_${{ matrix.artifact_tag }}.run
        archive: false
        retention-days: 7

    - name: 'Upload translations artifact'
      if: matrix.ubuntu == '22.04'
      uses: actions/upload-artifact@v4
      with:
        name: AmneziaVPN_translations
        path: client/translations
        retention-days: 7

# ------------------------------------------------------

  Bake-Prebuilts-Windows:
    runs-on: windows-latest
    needs: Detect-Changes
    if: needs.Detect-Changes.outputs.recipes_changed == 'true'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10
    
    - uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - uses: ilammy/msvc-dev-cmd@v1

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Build dependencies'
      run: cmake -S . -B build -DPREBUILTS_ONLY=1
    
    - name: 'Authorize in remote'
      if: github.ref == 'refs/heads/dev'
      run: conan remote login amnezia "${{ secrets.CONAN_USER }}" -p "${{ secrets.CONAN_PASSWORD }}"

    - name: 'Upload baked prebuilts'
      if: github.ref == 'refs/heads/dev'
      run: conan upload -r amnezia "*" -c

# ------------------------------------------------------

  Build-Windows:
    runs-on: windows-latest

    needs: Bake-Prebuilts-Windows
    if: ${{ always() }}

    env:
      QT_VERSION: 6.10.1
      QIF_VERSION: 4.7
      PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}
      PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
      FALLBACK_S3_ENDPOINT: ${{ secrets.FALLBACK_S3_ENDPOINT }}
      DEV_AGW_PUBLIC_KEY: ${{ secrets.DEV_AGW_PUBLIC_KEY }}
      DEV_AGW_ENDPOINT: ${{ secrets.DEV_AGW_ENDPOINT }}
      DEV_S3_ENDPOINT: ${{ secrets.DEV_S3_ENDPOINT }}
      FREE_V2_ENDPOINT: ${{ secrets.FREE_V2_ENDPOINT }}
      PREM_V1_ENDPOINT: ${{ secrets.PREM_V1_ENDPOINT }}

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        tools: 'tools_ifw'
        set-env: 'true'
        aqtversion: '==3.3.0'       
        py7zrversion: '==0.22.*'  
        extra: '--base ${{ env.QT_MIRROR }}' 

    - name: 'Setup mvsc'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: 'x64'

    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 'Install WiX Toolset'
      shell: powershell
      run: |
        dotnet tool install --global wix --version 4.0.6
        wix extension add -g WixToolset.UI.wixext/4.0.6
        wix extension add -g WixToolset.Util.wixext/4.0.6
        wix extension list -g
        $wixBinDir = Join-Path $env:USERPROFILE ".dotnet\tools"
        echo "WIX_BIN_DIR=$wixBinDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Build project'
      shell: cmd
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      run: |
        set WIX_ROOT_PATH="${{ env.USERPROFILE }}\.dotnet\tools"
        deploy\build.bat --installer all

    - name: 'Upload WIX installer artifact'
      uses: actions/upload-artifact@v7
      with:
        path: deploy/build/AmneziaVPN_*_windows_x64.msi
        archive: false
        retention-days: 7
      
    - name: 'Upload IFW installer artifact'
      uses: actions/upload-artifact@v7
      with:
        path: deploy/build/AmneziaVPN_*_windows_x64.exe
        archive: false
        retention-days: 7

# ------------------------------------------------------

  Bake-Prebuilts-iOS:
    needs: Detect-Changes
    if: needs.Detect-Changes.outputs.recipes_changed == 'true'

    strategy:
      matrix:
        xcode-version: [26.0, 26.4]
        include:
          - xcode-version: 26.4
            os: macos-26

    runs-on: ${{ matrix.os || 'macos-latest' }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10
    
    - uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode-version }}

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Build dependencies'
      run: cmake -S . -B build -G Xcode -DPREBUILTS_ONLY=1 -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos
    
    - name: 'Authorize in remote'
      if: github.ref == 'refs/heads/dev'
      run: conan remote login amnezia "${{ secrets.CONAN_USER }}" -p "${{ secrets.CONAN_PASSWORD }}"

    - name: 'Upload baked prebuilts'
      if: github.ref == 'refs/heads/dev'
      run: conan upload -r amnezia "*" -c

# ------------------------------------------------------

  Build-iOS:
    runs-on: macos-latest

    needs: Bake-Prebuilts-iOS
    if: ${{ always() }}

    env:
      QT_VERSION: 6.10.1
      KEYCHAIN_PASSWORD: ""

      PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}
      PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
      FALLBACK_S3_ENDPOINT: ${{ secrets.FALLBACK_S3_ENDPOINT }}
      DEV_AGW_PUBLIC_KEY: ${{ secrets.DEV_AGW_PUBLIC_KEY }}
      DEV_AGW_ENDPOINT: ${{ secrets.DEV_AGW_ENDPOINT }}
      DEV_S3_ENDPOINT: ${{ secrets.DEV_S3_ENDPOINT }}
      FREE_V2_ENDPOINT: ${{ secrets.FREE_V2_ENDPOINT }}
      PREM_V1_ENDPOINT: ${{ secrets.PREM_V1_ENDPOINT }}

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - uses: ./.github/actions/apple-setup-keychain
      id: setup-keychain
      with:
        keychain-password: ${{ env.KEYCHAIN_PASSWORD }}

    - name: 'Install signing certificate'
      uses: ./.github/actions/apple-install-cert
      with:
        keychain-path: ${{ steps.setup-keychain.outputs.keychain-path }}
        keychain-password: ${{ env.KEYCHAIN_PASSWORD }}
        cert-base64: ${{ secrets.IOS_SIGNING_CERT_BASE64 }}
        cert-password: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}

    - name: 'Install app provisioning profile'
      uses: ./.github/actions/apple-setup-provisioning-profile
      with:
        provisioning_profile_base64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE }}

    - name: 'Install NE provisioning profile'
      uses: ./.github/actions/apple-setup-provisioning-profile
      with:
        provisioning_profile_base64: ${{ secrets.IOS_NE_PROVISIONING_PROFILE }}

    - name: 'Setup xcode'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0'

    - name: 'Install desktop Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        modules: 'qtremoteobjects qt5compat qtshadertools qtmultimedia'
        arch: 'clang_64'
        dir: ${{ runner.temp }}
        set-env: 'true'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install iOS Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'ios'
        modules: 'qtremoteobjects qt5compat qtshadertools qtmultimedia'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        set-env: 'true'
        extra: '--external 7z --base ${{ env.QT_MIRROR }}'

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install deps'
      run: pip install "conan==2.28.0" jsonschema jinja2

    - name: 'Build project'
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
        APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
        APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        APPSTORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
      run: |
        sh deploy/build.sh -t ios | \
          sed -e '/-Xcc -DPROD_AGW_PUBLIC_KEY/,/-Xcc/ { /-Xcc/!d; }' -e '/-Xcc -DPROD_AGW_PUBLIC_KEY/d' | \
          sed -e '/-Xcc -DDEV_AGW_PUBLIC_KEY/,/-Xcc/ { /-Xcc/!d; }' -e '/-Xcc -DDEV_AGW_PUBLIC_KEY/d' | \
          sed -e '/-DPROD_AGW_PUBLIC_KEY/,/-D/ { /-D/!d; }' -e '/-DPROD_AGW_PUBLIC_KEY/d' | \
          sed -e '/-DDEV_AGW_PUBLIC_KEY/,/-D/ { /-D/!d; }' -e '/-DDEV_AGW_PUBLIC_KEY/d'

# ------------------------------------------------------

  Bake-Prebuilts-MacOS:
    needs: Detect-Changes
    if: needs.Detect-Changes.outputs.recipes_changed == 'true'

    strategy:
      matrix:
        xcode-version: [16.2, 16.4, 26.4]
        include:
          - xcode-version: 16.2
            os: macos-15
          - xcode-version: 16.4
            os: macos-15
          - xcode-version: 26.4
            os: macos-26

    runs-on: ${{ matrix.os || 'macos-latest' }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10
    
    - uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode-version }}

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Build dependencies'
      run: cmake -S . -B build -G Xcode -DPREBUILTS_ONLY=1
    
    - name: 'Authorize in remote'
      if: github.ref == 'refs/heads/dev'
      run: conan remote login amnezia "${{ secrets.CONAN_USER }}" -p "${{ secrets.CONAN_PASSWORD }}"

    - name: 'Upload baked prebuilts'
      if: github.ref == 'refs/heads/dev'
      run: conan upload -r amnezia "*" -c

# ------------------------------------------------------

  Build-MacOS:
    runs-on: macos-15

    needs: Bake-Prebuilts-MacOS
    if: ${{ always() }}

    env:
      QT_VERSION: 6.10.1
      KEYCHAIN_PASSWORD: ""

      PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}
      PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
      FALLBACK_S3_ENDPOINT: ${{ secrets.FALLBACK_S3_ENDPOINT }}
      DEV_AGW_PUBLIC_KEY: ${{ secrets.DEV_AGW_PUBLIC_KEY }}
      DEV_AGW_ENDPOINT: ${{ secrets.DEV_AGW_ENDPOINT }}
      DEV_S3_ENDPOINT: ${{ secrets.DEV_S3_ENDPOINT }}
      FREE_V2_ENDPOINT: ${{ secrets.FREE_V2_ENDPOINT }}
      PREM_V1_ENDPOINT: ${{ secrets.PREM_V1_ENDPOINT }}

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - uses: ./.github/actions/apple-setup-keychain
      id: setup-keychain
      with:
        keychain-password: ${{ env.KEYCHAIN_PASSWORD }}

    - uses: ./.github/actions/apple-install-cert
      with:
        keychain-path: ${{ steps.setup-keychain.outputs.keychain-path }}
        keychain-password: ${{ env.KEYCHAIN_PASSWORD }}
        cert-base64: ${{ secrets.MAC_APP_CERT_CERT }}
        cert-password: ${{ secrets.MAC_APP_CERT_PW }}

    - uses: ./.github/actions/apple-install-cert
      with:
        keychain-path: ${{ steps.setup-keychain.outputs.keychain-path }}
        keychain-password: ${{ env.KEYCHAIN_PASSWORD }}
        cert-base64: ${{ secrets.MAC_INSTALLER_SIGNER_CERT }}
        cert-password: ${{ secrets.MAC_INSTALL_CERT_PW }}

    - name: 'Setup xcode'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3.0'

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        set-env: 'true'
        aqtversion: '==3.3.0'       
        py7zrversion: '==0.22.*'  
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Build project'
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
        CODESIGN_SIGNATURE: ${{ secrets.MAC_SIGNER_ID }}
        CODESIGN_INSTALLER_SIGNATURE: ${{ secrets.MAC_INSTALLER_SIGNER_ID }}
        CODESIGN_KEYCHAIN: ${{ steps.setup-keychain.outputs.keychain-path }}
        CODESIGN_INSTALLER_KEYCHAIN: ${{ steps.setup-keychain.outputs.keychain-path }}
        NOTARYTOOL_TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
        NOTARYTOOL_EMAIL: ${{ secrets.APPLE_DEV_EMAIL }}
        NOTARYTOOL_PASSWORD: ${{ secrets.APPLE_DEV_PASSWORD }}
      shell: bash
      run: deploy/build.sh --generator Ninja --installer all

    - name: 'Upload installer artifact'
      uses: actions/upload-artifact@v7
      with:
        path: deploy/build/AmneziaVPN_*_macos_x64.pkg
        archive: false
        retention-days: 7

# ------------------------------------------------------

  Bake-Prebuilts-MacOS-NE:
    needs: Detect-Changes
    if: needs.Detect-Changes.outputs.recipes_changed == 'true'

    strategy:
      matrix:
        xcode-version: [16.2, 16.4, 26.4]
        include:
          - xcode-version: 16.2
            os: macos-15
          - xcode-version: 16.4
            os: macos-15
          - xcode-version: 26.4
            os: macos-26

    runs-on: ${{ matrix.os || 'macos-latest' }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10
    
    - uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode-version }}

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Build dependencies'
      run: cmake -S . -B build -G Xcode -DPREBUILTS_ONLY=1 -DMACOS_NE=TRUE
    
    - name: 'Authorize in remote'
      if: github.ref == 'refs/heads/dev'
      run: conan remote login amnezia "${{ secrets.CONAN_USER }}" -p "${{ secrets.CONAN_PASSWORD }}"

    - name: 'Upload baked prebuilts'
      if: github.ref == 'refs/heads/dev'
      run: conan upload -r amnezia "*" -c

# ------------------------------------------------------

  Build-MacOS-NE:
    runs-on: macos-26

    needs: Bake-Prebuilts-MacOS-NE
    if: ${{ always() }}

    env:
      QT_VERSION: 6.10.1

      MAC_TEAM_ID: ${{ secrets.MAC_TEAM_ID }}

      MAC_APP_CERT_CERT: ${{ secrets.MAC_APP_CERT_CERT }}
      MAC_SIGNER_ID: ${{ secrets.MAC_SIGNER_ID }}
      MAC_APP_CERT_PW: ${{ secrets.MAC_APP_CERT_PW }}

      PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}
      PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
      FALLBACK_S3_ENDPOINT: ${{ secrets.FALLBACK_S3_ENDPOINT }}
      DEV_AGW_PUBLIC_KEY: ${{ secrets.DEV_AGW_PUBLIC_KEY }}
      DEV_AGW_ENDPOINT: ${{ secrets.DEV_AGW_ENDPOINT }}
      DEV_S3_ENDPOINT: ${{ secrets.DEV_S3_ENDPOINT }}
      FREE_V2_ENDPOINT: ${{ secrets.FREE_V2_ENDPOINT }}
      PREM_V1_ENDPOINT: ${{ secrets.PREM_V1_ENDPOINT }}

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - uses: ./.github/actions/apple-setup-provisioning-profile
      with:
        provisioning_profile_base64: ${{ secrets.MAC_APP_PROVISIONING_PROFILE }}

    - uses: ./.github/actions/apple-setup-provisioning-profile
      with:
        provisioning_profile_base64: ${{ secrets.MAC_NE_PROVISIONING_PROFILE }}

    - name: 'Setup xcode'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.1'

    - name: 'Install desktop Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        modules: 'qtremoteobjects qt5compat qtshadertools qtmultimedia'
        arch: 'clang_64'
        dir: ${{ runner.temp }}
        set-env: 'true'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install go'
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: false

    - name: 'Setup gomobile'
      run: |
          export PATH=$PATH:~/go/bin
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Build project'
      run: |
        export QT_BIN_DIR="${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/macos/bin"
        bash deploy/build_macos_ne.sh

    - name: 'Upload unpacked artifact'
      uses: actions/upload-artifact@v4
      with:
        name: AmneziaVPN_MacOS_unpacked
        path: deploy/build/client/AmneziaVPN.app
        retention-days: 7

# ------------------------------------------------------

  Bake-Prebuilts-Android:
    runs-on: android-runner
    needs: Detect-Changes
    if: needs.Detect-Changes.outputs.recipes_changed == 'true'

    env:
      ANDROID_PLATFORM: android-28
      NDK_VERSION: 27.0.11718014

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10
    
    - uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Setup Android SDK'
      uses: android-actions/setup-android@v4
      with:
        packages: "platforms;${{ env.ANDROID_PLATFORM }} ndk;${{ env.NDK_VERSION }}"

    - name: 'Build dependencies'
      run: |
        CMAKE_ANDROID_NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
        args=(
          -G Ninja
          -DPREBUILTS_ONLY=1
          -DCMAKE_SYSTEM_NAME=Android
          "-DANDROID_PLATFORM=$ANDROID_PLATFORM"
          "-DCMAKE_ANDROID_NDK=$CMAKE_ANDROID_NDK"
        )

        for abi in arm64-v8a armeabi-v7a x86 x86_64; do
          for build_type in Release Debug; do
            cmake -S . -B build_${abi//-/_} "${args[@]}" "-DCMAKE_ANDROID_ARCH_ABI=$abi" "-DCMAKE_BUILD_TYPE=$build_type"
          done
        done

    - name: 'Authorize in remote'
      if: github.ref == 'refs/heads/dev'
      run: conan remote login amnezia "${{ secrets.CONAN_USER }}" -p "${{ secrets.CONAN_PASSWORD }}"

    - name: 'Upload baked prebuilts'
      if: github.ref == 'refs/heads/dev'
      run: conan upload -r amnezia "*" -c

# ------------------------------------------------------

  Build-Android:
    runs-on: android-runner

    needs: Bake-Prebuilts-Android
    if: ${{ always() }}

    env:
      ANDROID_PLATFORM: android-28
      NDK_VERSION: 27.0.11718014
      QT_VERSION: 6.10.3
      QT_MODULES: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
      PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}
      PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
      FALLBACK_S3_ENDPOINT: ${{ secrets.FALLBACK_S3_ENDPOINT }}
      DEV_AGW_PUBLIC_KEY: ${{ secrets.DEV_AGW_PUBLIC_KEY }}
      DEV_AGW_ENDPOINT: ${{ secrets.DEV_AGW_ENDPOINT }}
      DEV_S3_ENDPOINT: ${{ secrets.DEV_S3_ENDPOINT }}
      FREE_V2_ENDPOINT: ${{ secrets.FREE_V2_ENDPOINT }}
      PREM_V1_ENDPOINT: ${{ secrets.PREM_V1_ENDPOINT }}

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: 'Install desktop Qt'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install android_x86_64 Qt'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'android'
        arch: 'android_x86_64'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install android_x86 Qt'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'android'
        arch: 'android_x86'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install android_armv7 Qt'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'android'
        arch: 'android_armv7'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install android_arm64_v8a Qt'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup Java'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 'Setup Android SDK'
      uses: android-actions/setup-android@v4
      with:
        packages: "platforms;${{ env.ANDROID_PLATFORM }} ndk;${{ env.NDK_VERSION }}"

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Decode keystore secret to file'
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      shell: bash
      run: |
        echo $KEYSTORE_BASE64 | base64 --decode > android.keystore

    - name: 'Build project'
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
        QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android.keystore
        QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_KEY_ALIAS }}
        QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_KEY_PASS }}
      shell: bash
      run: |
        deploy/build.sh -t android --sign --aab

        VERSION=$(grep CMAKE_PROJECT_VERSION:STATIC deploy/build/CMakeCache.txt | cut -d= -f2)

        (cd deploy/build/client/android-build && mv AmneziaVPN.apk AmneziaVPN_${VERSION}_android9+_universal.apk)
        (cd deploy/build/client/android-build/build/outputs/bundle/release && mv android-build-release.aab AmneziaVPN_${VERSION}.aab)

        for abi in arm64-v8a armeabi-v7a x86 x86_64; do
          deploy/build.sh -t android --sign --abi ${abi} --build ./deploy/build/${abi}
          (cd deploy/build/${abi}/client/android-build && mv AmneziaVPN.apk AmneziaVPN_${VERSION}_android9+_${abi}.apk)
        done

    - name: 'Upload universal APK'
      uses: actions/upload-artifact@v7
      with:
        path: deploy/build/client/android-build/*.apk
        archive: false
        retention-days: 7

    - name: 'Upload AAB'
      uses: actions/upload-artifact@v7
      with:
        path: deploy/build/client/android-build/build/outputs/bundle/release/*.aab
        archive: false
        retention-days: 7

    - name: 'Upload arm64-v8a APK'
      uses: actions/upload-artifact@v7
      with:
        path: deploy/build/arm64-v8a/client/android-build/*.apk
        archive: false
        retention-days: 7

    - name: 'Upload armeabi-v7a APK'
      uses: actions/upload-artifact@v7
      with:
        path: deploy/build/armeabi-v7a/client/android-build/*.apk
        archive: false
        retention-days: 7

    - name: 'Upload x86 APK'
      uses: actions/upload-artifact@v7
      with:
        path: deploy/build/x86/client/android-build/*.apk
        archive: false
        retention-days: 7

    - name: 'Upload x86_64 APK'
      uses: actions/upload-artifact@v7
      with:
        path: deploy/build/x86_64/client/android-build/*.apk
        archive: false
        retention-days: 7

  Extra:
    runs-on: ubuntu-latest
    steps:
      - name: Search a corresponding PR
        uses: octokit/request-action@v2.x
        id: pull_request
        with:
          route: GET /repos/${{ github.repository }}/pulls
          head: ${{ github.repository_owner }}:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add PR link to build summary
        if: ${{ fromJSON(steps.pull_request.outputs.data)[0].number != '' }}
        run: | 
          echo "Pull request:" >> $GITHUB_STEP_SUMMARY
          echo "[[#${{ fromJSON(steps.pull_request.outputs.data)[0].number }}] ${{ fromJSON(steps.pull_request.outputs.data)[0].title }}](${{ fromJSON(steps.pull_request.outputs.data)[0].html_url }})" >> $GITHUB_STEP_SUMMARY

