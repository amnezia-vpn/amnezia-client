# Bypass traffic sourced by the split-tunnel system extension (gid amnvpn).
#
# Numbered 320 on purpose: it has to win over 250.blockIPv6 and 310.blockDNS,
# which the WireGuard path enables while the kill switch is armed. pf is
# last-match-wins, so an earlier anchor would be overridden by those two and
# excluded apps would lose IPv6 and direct DNS.
pass out proto { tcp, udp } group amnvpn flags any no state
