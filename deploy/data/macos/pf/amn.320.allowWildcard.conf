# Addresses learned for wildcard site entries, and the DNS observer's own
# endpoint. Owned by the daemon alone (no other writer replaces these tables)
# and evaluated after 310.blockDNS, so a pass here wins over the blocks above.
table <wildcardnets> {}
pass out to <wildcardnets> flags any no state
table <wildcarddns> {}
pass out proto { tcp, udp } to <wildcarddns> port 53 flags any no state
